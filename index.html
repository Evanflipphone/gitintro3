<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calibre Graphing Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="graphing-app" aria-label="Graphing calculator">
      <header class="calculator-header">
        <div class="brand-mark" aria-hidden="true">∿</div>
        <div>
          <p class="eyebrow">CALIBRE / GRAPH 01</p>
          <h1>Graphing calculator</h1>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
      </header>

      <div class="graph-toolbar">
        <div class="toolbar-copy"><span class="status-dot"></span><span id="graphStatus">LIVE PLOT</span></div>
        <div class="zoom-controls" aria-label="Graph zoom controls">
          <button class="zoom-button" data-zoom="out" type="button" aria-label="Zoom out">−</button>
          <span id="zoomLabel">1.0×</span>
          <button class="zoom-button" data-zoom="in" type="button" aria-label="Zoom in">+</button>
          <button class="reset-button" id="resetView" type="button">Reset view</button>
        </div>
      </div>

      <div class="plot-wrap">
        <canvas id="graphCanvas" aria-label="Interactive graph plot"></canvas>
        <div class="axis-label axis-x">x</div>
        <div class="axis-label axis-y">y</div>
      </div>

      <div class="graph-footer"><span>Drag to pan</span><span>Scroll to zoom</span><span>Enter adds expression</span></div>
    </section>

    <aside class="expression-panel" aria-label="Expressions">
      <div class="history-heading">
        <div>
          <p class="eyebrow">EXPRESSIONS / 02</p>
          <h2>What are you plotting?</h2>
        </div>
        <button class="text-button" id="clearExpressions" type="button">Clear</button>
      </div>
      <div id="expressionList" class="expression-list"></div>
      <button class="add-expression" id="addExpression" type="button"><span>+</span> Add expression</button>
      <div class="examples">
        <p class="eyebrow">TRY THESE</p>
        <button class="example" data-expression="y = x^2">y = x²</button>
        <button class="example" data-expression="y = sin(x)">y = sin(x)</button>
        <button class="example" data-expression="y = 2x + 1">y = 2x + 1</button>
      </div>
      <div class="tip"><span class="tip-icon">i</span><p>Type any expression in x. Use the graph controls to explore the plane.</p></div>
    </aside>
  </main>
  <script src="script.js?v=2"></script>
</body>
</html>
